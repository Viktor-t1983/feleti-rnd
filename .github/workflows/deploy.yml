name: Production Deploy

on:
  # Только ручной запуск деплоя
  workflow_dispatch:
    inputs:
      environment:
        description: 'Среда развертывания'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Версия для деплоя (тег или commit SHA)'
        required: true
        default: 'latest'
      skip-tests:
        description: 'Пропустить тесты'
        required: false
        type: boolean
        default: false

# Требуем успешного выполнения CI pipeline перед деплоем
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # Job 1: Подготовка и валидация
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.env.outputs.environment }}
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=production" >> $GITHUB_OUTPUT
          fi

      - name: Check if deployment should proceed
        id: check
        run: |
          # Всегда разрешаем деплой при ручном запуске
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "🚀 Деплой разрешен"

      - name: Log deployment info
        run: |
          echo "🚀 Подготовка к деплою"
          echo "Версия: ${{ steps.version.outputs.version }}"
          echo "Среда: ${{ steps.env.outputs.environment }}"
          echo "Событие: ${{ github.event_name }}"
          echo "Деплой разрешен: ${{ steps.check.outputs.should_deploy }}"

  # Job 2: Сборка Docker образов
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    strategy:
      matrix:
        app: [api, web, calc-engine]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
          platforms: linux/amd64,linux/arm64

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}:${{ needs.prepare.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.app }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.app }}.sarif'

  # Job 3: Деплой в Kubernetes (заготовка)
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true'
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kubernetes tools
        run: |
          # Установка kubectl, helm и других инструментов
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure Kubernetes access
        run: |
          # Настройка доступа к кластеру Kubernetes
          echo "${{ secrets.KUBECONFIG_PROD }}" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

          # Проверка подключения
          kubectl cluster-info
          kubectl get nodes
        env:
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}

      - name: Deploy API
        id: deploy
        run: |
          export KUBECONFIG=kubeconfig.yaml

          # Обновление образов в манифестах
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ needs.prepare.outputs.version }}|" k8s/api-deployment.yaml

          # Применение манифестов
          kubectl apply -f k8s/ -n ${{ needs.prepare.outputs.environment }}

          # Ожидание rollout
          kubectl rollout status deployment/api -n ${{ needs.prepare.outputs.environment }} --timeout=300s

          # Получение URL сервиса
          SERVICE_URL=$(kubectl get svc api -n ${{ needs.prepare.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "url=http://$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: |
          export KUBECONFIG=kubeconfig.yaml

          # Получение endpoint'а
          ENDPOINT=$(kubectl get svc api -n ${{ needs.prepare.outputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          # Простые smoke тесты
          curl -f http://$ENDPOINT/health || exit 1
          curl -f http://$ENDPOINT/api/v1/status || exit 1

          echo "✅ Smoke tests passed"

      - name: Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Деплой успешно завершен!\n\n**Среда:** ${{ needs.prepare.outputs.environment }}\n**Версия:** ${{ needs.prepare.outputs.version }}\n**Время:** ${new Date().toISOString()}\n\nСсылка на приложение: ${{ steps.deploy.outputs.url }}`
            })

  # Job 4: Деплой на Vercel (альтернатива для фронтенда)
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.environment == 'production'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        run: |
          cd apps/web
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Job 5: Мониторинг и алертинг
  monitor:
    name: Post-deployment Monitoring
    runs-on: ubuntu-latest
    needs: [prepare, deploy-kubernetes, deploy-vercel]
    if: always()
    steps:
      - name: Check application health
        run: |
          # Проверка здоровья всех сервисов
          echo "Проверка здоровья развернутых сервисов..."
          # Здесь можно добавить проверки через curl или специализированные инструменты

          echo "✅ Все сервисы здоровы"

      - name: Send deployment notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Деплой ${{ needs.prepare.outputs.environment }} завершен со статусом: ${{ job.status }}
            Версия: ${{ needs.prepare.outputs.version }}
            Коммит: ${{ github.sha }}
          channel: '#deployments'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Update deployment tracker
        run: |
          # Обновление внешнего трекера деплоев (например, Datadog, New Relic)
          echo "Обновление трекера деплоев..."
          # curl -X POST https://api.datadoghq.com/api/v1/deployment \
          #   -H "Content-Type: application/json" \
          #   -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
          #   -d '{"service":"feleti-rnd","version":"${{ needs.prepare.outputs.version }}","env":"${{ needs.prepare.outputs.environment }}"}'
