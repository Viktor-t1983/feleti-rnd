name: CI — Tests & Quality

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # каждую ночь в 2:00

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feleti
          POSTGRES_PASSWORD: feleti_test_password
          POSTGRES_DB: feleti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test environment
        working-directory: apps/api
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://feleti:feleti_test_password@localhost:5432/feleti_test" >> .env.test
          echo "JWT_SECRET=test_secret_for_ci_only_not_production" >> .env.test
          echo "JWT_REFRESH_SECRET=test_refresh_secret_for_ci_only" >> .env.test

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://feleti:feleti_test_password@localhost:5432/feleti_test

      - name: Run API tests
        working-directory: apps/api
        run: npm test -- --reporter=verbose
        env:
          DATABASE_URL: postgresql://feleti:feleti_test_password@localhost:5432/feleti_test
          JWT_SECRET: test_secret_for_ci_only_not_production
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci_only
          NODE_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/coverage/

  test-python:
    name: Python Calc Engine Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/calc-engine
        run: pip install -r requirements.txt

      - name: Run Python tests
        working-directory: apps/calc-engine
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspaces --if-present

      - name: TypeScript check
        run: npm run build --workspaces --if-present

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for secrets in git
        run: |
          if git ls-files | grep -E "\.env$|\.env\.production$"; then
            echo "❌ ОШИБКА: .env файл найден в git!"
            exit 1
          fi
          echo "✅ .env файлы не в git"

      - name: npm audit
        run: npm audit --audit-level=high --workspaces
        continue-on-error: true
