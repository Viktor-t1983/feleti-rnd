name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Разрешить параллельное выполнение jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Линтинг кода
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies (API)
        run: npm ci
        working-directory: ./apps/api

      - name: Install dependencies (Web)
        run: npm ci
        working-directory: ./apps/web

      - name: Run ESLint for API
        run: npx eslint "src/**/*.ts" --max-warnings=0
        working-directory: ./apps/api
        if: always()

      - name: Run ESLint for Web
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
        working-directory: ./apps/web
        if: always()

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,json}"
        working-directory: ./apps/api
        if: always()

  # Job 2: Тестирование API
  test-api:
    name: Test API Backend
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: feleti_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/api

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feleti_test

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feleti_test

      - name: Run tests with coverage
        run: npm test -- --coverage
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feleti_test
          NODE_ENV: test
          JWT_SECRET: test-secret-key

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: ./apps/api/coverage
          flags: api-tests
          name: api-coverage

  # Job 3: Тестирование Web фронтенда
  test-web:
    name: Test Web Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Run tests
        run: npm test -- --coverage
        working-directory: ./apps/web
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: ./apps/web/coverage
          flags: web-tests
          name: web-coverage

  # Job 4: Сборка приложений
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Build API
        run: npm run build
        working-directory: ./apps/api

      - name: Build Web
        run: npm run build
        working-directory: ./apps/web

      - name: Verify build artifacts
        run: |
          ls -la ./apps/api/dist/
          ls -la ./apps/web/dist/
        if: always()

  # Job 5: Проверка безопасности зависимостей
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit API dependencies
        run: npm audit --audit-level=high
        working-directory: ./apps/api
        continue-on-error: true

      - name: Audit Web dependencies
        run: npm audit --audit-level=high
        working-directory: ./apps/web
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 6: Итоговый статус pipeline
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-web, build, security]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          echo "Все jobs завершены:"
          echo "lint: ${{ needs.lint.result }}"
          echo "test-api: ${{ needs.test-api.result }}"
          echo "test-web: ${{ needs.test-web.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "security: ${{ needs.security.result }}"
          
          # Проверяем, есть ли неудачные jobs
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-web.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline завершился с ошибками"
            exit 1
          else
            echo "✅ CI Pipeline успешно пройден"
          fi