name: CI — Tests & Quality

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  security:
    name: 🔒 Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env files in git
        run: |
          if git ls-files | grep -E "^\.env$|\.env\.production$"; then
            echo "❌ .env файл в git!"
            exit 1
          fi
          echo "✅ Секреты не в git"

  test-python:
    name: 🐍 Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        working-directory: apps/calc-engine
        run: pip install -r requirements.txt
      - name: Pytest
        working-directory: apps/calc-engine
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: 📋 Lint (warning only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Prettier API
        working-directory: apps/api
        run: npx prettier --check "src/**/*.{ts,json}"
        continue-on-error: true
      - name: Prettier Web
        working-directory: apps/web
        run: npx prettier --check "src/**/*.{ts,tsx,json}"
        continue-on-error: true
      - name: ESLint API
        working-directory: apps/api
        run: npm run lint
        continue-on-error: true
      - name: TypeScript API
        working-directory: apps/api
        run: npx tsc --noEmit
        continue-on-error: true

  test-api:
    name: 🧪 API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feleti
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: feleti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://feleti:ci_test_password@localhost:5432/feleti_test
      JWT_SECRET: ci_jwt_secret_32_chars_minimum_len
      JWT_REFRESH_SECRET: ci_refresh_secret_32chars_min
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - name: Migrate
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Run tests
        working-directory: apps/api
        run: npm test
