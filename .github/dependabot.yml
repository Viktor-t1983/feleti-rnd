# Конфигурация Dependabot для автоматического обновления зависимостей
version: 2
updates:
  # Обновление npm зависимостей для API приложения
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "api"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    ignore:
      - dependency-name: "typescript"
        versions: ["5.x"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  # Обновление npm зависимостей для Web приложения
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    ignore:
      - dependency-name: "typescript"
        versions: ["5.x"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  # Обновление Python зависимостей для Calc Engine
  - package-ecosystem: "pip"
    directory: "/apps/calc-engine"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "10:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "calc-engine"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "pandas"
        versions: ["2.x"]

  # Обновление GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci/cd"
    commit-message:
      prefix: "chore(gh-actions)"

  # Обновление Docker образов (если есть Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "chore(docker)"